# FiscorAI — Render Blueprint
# Secrets (DATABASE_URL, R2, LEMONSQUEEZY_*) are set in the Render dashboard — not committed.

services:
  - type: web
    name: fiscorai
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    autoDeploy: true
    buildCommand: corepack enable && corepack prepare pnpm@9.15.0 --activate && pnpm install --frozen-lockfile && pnpm --filter @fiscorai/tax-processor build && pnpm --filter @fiscorai/api exec prisma generate && pnpm --filter @fiscorai/api exec prisma migrate deploy && pnpm --filter @fiscorai/api build
    # Keep start lean — free-tier cold starts used to burn 20–30s on migrate before listen.
    startCommand: cd apps/api && node dist/server.js
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 2h
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: STORAGE_BACKEND
        value: r2
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_JURISDICTION
        sync: false
      - key: CORS_ORIGIN
        value: https://fiscorai.com,https://www.fiscorai.com
      - key: PAYMENT_SUCCESS_URL
        value: https://fiscorai.com/thankyou
      - key: PAYMENT_CANCEL_URL
        value: https://fiscorai.com/payment-failed
      - key: LEMONSQUEEZY_API_KEY
        sync: false
      - key: LEMONSQUEEZY_STORE_ID
        sync: false
      - key: LEMONSQUEEZY_WEBHOOK_SECRET
        sync: false
      - key: LEMONSQUEEZY_VARIANT_BASIC
        sync: false
      - key: LEMONSQUEEZY_VARIANT_STANDARD
        sync: false
      - key: LEMONSQUEEZY_VARIANT_PRO
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite

  - type: web
    name: fiscorai-web
    runtime: static
    plan: free
    region: frankfurt
    branch: main
    autoDeploy: true
    buildCommand: corepack enable && corepack prepare pnpm@9.15.0 --activate && pnpm install --frozen-lockfile && pnpm --filter @fiscorai/web build
    staticPublishPath: apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: VITE_API_URL
        value: https://api.fiscorai.com
